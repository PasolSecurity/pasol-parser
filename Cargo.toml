[workspace]
members = [
    "crates/parser-core",
    "crates/pe-parser",
    "crates/parser-sdk",
    "crates/pasol-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["PasolSecurity contributors"]
repository = "https://github.com/PasolSecurity/pasol-parser"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = "0.7"
goblin = "0.10.7"
hex = "0.4"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
