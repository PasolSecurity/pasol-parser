name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: pasol-x86_64-unknown-linux-gnu.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: pasol-x86_64-pc-windows-msvc.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pasol-cli
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} pasol
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/pasol.exe ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "${{ matrix.archive }}" }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true, files: "artifacts/*" }
