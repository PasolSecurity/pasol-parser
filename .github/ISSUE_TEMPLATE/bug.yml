name: Bug report
description: Report a reproducible non-security defect
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Do not attach malware or report vulnerabilities here; use private vulnerability reporting." }
  - type: input
    id: version
    attributes: { label: Version }
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior and reproduction }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
